# Aula 04 - Parte 3: 3 réplicas da API atrás de um balanceador (nginx).
#   docker compose up -d
services:
  api:
    # A imagem publicada na Parte 2. Se ela não existir, o Compose faz o build.
    image: localhost:5050/churn-api:v1
    build:
      context: ../Parte1_API_com_FastAPI
      dockerfile: ../Parte2_Docker_e_Registry/Dockerfile
    deploy:
      replicas: 3
    restart: unless-stopped

  balanceador:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy   # só recebe tráfego quando as réplicas estiverem saudáveis
