# Balanceador round-robin: distribui as requisições entre as réplicas da API.
events {}

http {
    upstream api {
        # "api" é o nome do serviço no Compose; o DNS interno devolve o IP de cada réplica.
        # Se uma réplica falhar, ela sai do rodízio por 10 s.
        server api:8000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://api;
            proxy_connect_timeout 1s;            # réplica fora do ar: desiste rápido...
            proxy_next_upstream error timeout;   # ...e tenta a próxima
        }
    }
}
