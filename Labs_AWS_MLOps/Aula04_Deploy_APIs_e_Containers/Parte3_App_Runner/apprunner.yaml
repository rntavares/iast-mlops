# Configuracao de referencia equivalente ao que se define na tela do console
# (usada aqui como documentacao - o deploy via ECR nao exige este arquivo)
version: 1.0
runtime: docker
build:
  commands:
    build:
      - echo "build feito via docker (ECR)"
run:
  runtime-version: latest
  command: uvicorn main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    - name: PORT
      value: "8000"
