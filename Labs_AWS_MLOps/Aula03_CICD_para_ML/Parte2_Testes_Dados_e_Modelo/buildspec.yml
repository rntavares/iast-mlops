version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install -r requirements.txt || pip install pandas scikit-learn pytest
  build:
    commands:
      - echo "Fase 1: testes de codigo"
      - pytest tests/ -v

      - echo "Fase 2: testes de qualidade de dados"
      - python scripts/test_data_quality.py

      - echo "Fase 3: testes de qualidade do modelo"
      - python scripts/test_model_quality.py
artifacts:
  files:
    - '**/*'
